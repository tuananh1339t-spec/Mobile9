<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MobileConfig Pro - Tính Năng Thực Tế</title>
    <style>
        :root {
            --primary: #6d28d9;
            --secondary: #f59e0b;
            --cyan: #06b6d4;
            --green: #10b981;
            --bg: #03000a;
            --panel-bg: #0f0a1e;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(109, 40, 217, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(109, 40, 217, 0.15), transparent 50%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            text-align: center;
            z-index: 10;
            flex-shrink: 0;
        }

        h1 {
            font-size: 18px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 10px auto 0;
            padding: 12px 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: white;
            font-size: 15px;
            outline: none;
            display: block;
        }
        .search-box:focus { border-color: var(--cyan); }

        /* CATEGORY SCROLL */
        .category-scroll {
            display: flex;
            overflow-x: auto;
            padding: 10px 15px;
            gap: 10px;
            background: rgba(10, 5, 20, 0.9);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            white-space: nowrap;
            padding: 8px 16px;
            background: rgba(109, 40, 217, 0.1);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 20px;
            font-size: 13px;
            transition: 0.3s;
        }
        .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: bold;
        }

        /* FEATURE LIST */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .feature-card {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .feature-card:active { background: rgba(109, 40, 217, 0.2); transform: scale(0.98); }

        .f-icon {
            font-size: 24px;
            margin-right: 15px;
            background: rgba(109, 40, 217, 0.2);
            width: 45px; height: 45px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .f-info { flex: 1; min-width: 0; }
        .f-title { font-size: 15px; font-weight: bold; color: #e5e7eb; margin-bottom: 4px; }
        .f-desc { font-size: 12px; color: var(--text-muted); }

        /* CONFIG PANEL (BOTTOM SHEET) */
        .config-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 99;
        }
        .config-overlay.show { opacity: 1; pointer-events: auto; }

        .config-panel {
            position: fixed;
            bottom: -100%;
            left: 0; right: 0;
            height: 90vh;
            background: var(--panel-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: bottom 0.3s cubic-bezier(0.1, 0.7, 0.1, 1);
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }
        .config-panel.show { bottom: 0; }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .panel-title { font-size: 16px; color: var(--secondary); font-weight: bold; }
        .close-btn {
            background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;
            width: 35px; height: 35px; border-radius: 50%; font-size: 20px;
            display: flex; justify-content: center; align-items: center;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--cyan); font-weight: 500; }
        input, select { 
            width: 100%; padding: 14px;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 10px; 
            color: var(--text); font-size: 16px; outline: none; 
        }
        input:focus, select:focus { border-color: var(--cyan); }

        .xml-preview {
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #a78bfa;
            overflow-x: auto;
            max-height: 150px;
            white-space: pre;
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(109, 40, 217, 0.4);
        }
        .btn-download:active { transform: scale(0.98); }

        /* DESKTOP MODE */
        @media (min-width: 768px) {
            .category-scroll { justify-content: center; }
            .main-content { 
                display: grid; 
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
                gap: 15px; 
                max-width: 1200px; 
                margin: 0 auto;
                padding: 20px;
            }
            .feature-card { margin-bottom: 0; cursor: pointer; }
            .feature-card:hover { border-color: var(--cyan); background: rgba(109, 40, 217, 0.1); }
            
            .config-panel {
                width: 550px;
                height: auto;
                max-height: 85vh;
                bottom: auto;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0.9);
                border-radius: 20px;
                opacity: 0;
                pointer-events: none;
                transition: 0.3s;
            }
            .config-panel.show {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>MobileConfig Pro (Real)</h1>
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Tìm tính năng thật (VPN, Proxy, Wi-Fi...)" oninput="renderFeatures()">
</header>

<div class="category-scroll" id="categoryScroll">
    <!-- Render bằng JS -->
</div>

<div class="main-content" id="featureList">
    <!-- Render bằng JS -->
</div>

<!-- Overlay & Panel -->
<div class="config-overlay" id="configOverlay" onclick="closePanel()"></div>

<div class="config-panel" id="configPanel">
    <div class="panel-header">
        <div class="panel-title" id="panelTitle">Cấu hình</div>
        <button class="close-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body">
        <div id="formContainer"></div>
        
        <div style="font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between;">
            <span>Xem trước mã XML (Plist)</span>
            <span style="color:var(--green);">● Live</span>
        </div>
        <div class="xml-preview" id="xmlPreview"></div>
        
        <button class="btn-download" onclick="generateConfigFile()">Tải Xuống .mobileconfig</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. DỮ LIỆU TÍNH NĂNG (CHỈ CÁC TÍNH NĂNG THẬT)
    // ==========================================
    const categories = ["Tất cả", "VPN & Proxy", "Wi-Fi & Mạng", "Bảo Mật & Hệ Thống", "Tiện Ích"];

    const features = [
        // NHÓM VPN & PROXY
        { id: 1, title: "VPN IKEv2", icon: "🛡️", desc: "Tạo đường hầm bảo mật (Cần Server)", cat: 1, type: "vpn_ikev2" },
        { id: 2, title: "VPN L2TP", icon: "🔒", desc: "Cấu hình VPN L2TP (Phổ biến cho Game)", cat: 1, type: "vpn_l2tp" },
        { id: 3, title: "Proxy HTTP", icon: "🌐", desc: "Cấu hình Proxy HTTP (Đổi IP, Fake IP)", cat: 1, type: "proxy" },
        { id: 4, title: "Proxy SOCKS", icon: "🧦", desc: "Cấu hình Proxy SOCKS", cat: 1, type: "proxy" },
        { id: 5, title: "Proxy PAC (Auto)", icon: "📜", desc: "Cấu hình file PAC tự động", cat: 1, type: "pac" },

        // NHÓM WI-FI & MẠNG
        { id: 6, title: "Wi-Fi Tĩnh (IP)", icon: "📡", desc: "Đặt IP tĩnh cho Wi-Fi (Giảm Ping)", cat: 2, type: "wifi_static" },
        { id: 7, title: "Wi-Fi Tự Động", icon: "🔑", desc: "Tự động kết nối Wi-Fi giải đấu", cat: 2, type: "wifi_auto" },
        { id: 8, title: "Wi-Fi Doanh Nghiệp", icon: "🏢", desc: "Kết nối WPA2-Enterprise", cat: 2, type: "wifi_enterprise" },
        { id: 9, title: "Cấu Hình APN", icon: "📶", desc: "Thay đổi APN mạng 3G/4G/5G", cat: 2, type: "apn" },
        { id: 10, title: "DNS Toàn Hệ Thống", icon: "🌍", desc: "Đổi DNS sang Cloudflare/Google", cat: 2, type: "dns" },

        // NHÓM BẢO MẬT & HỆ THỐNG
        { id: 11, title: "Chặn Cập Nhật OTA", icon: "⏸️", desc: "Chặn iOS tự động cập nhật (Giữ máy mượt)", cat: 3, type: "ota_block" },
        { id: 12, title: "Cài Chứng Chỉ CA", icon: "📜", desc: "Cài chứng chỉ tin cậy cho Tool", cat: 3, type: "cert" },
        { id: 13, title: "Khóa Cấu Hình", icon: "🔒", desc: "Ngăn người khác xóa cấu hình", cat: 3, type: "lock" },
        { id: 14, title: "Giới Hạn Web", icon: "🔞", desc: "Chặn web đen, web lạ", cat: 3, type: "webfilter" },
        { id: 15, title: "Cấu Hình Email", icon: "📧", desc: "Cài đặt Email Team/Doanh nghiệp", cat: 3, type: "email" },
        { id: 16, title: "Quản Lý Danh Bạ", icon: "📖", desc: "Cấu hình LDAP danh bạ", cat: 3, type: "ldap" },

        // NHÓM TIỆN ÍCH
        { id: 17, title: "Web Clip (Icon)", icon: "📱", desc: "Tạo icon Game/Web ngoài màn hình", cat: 4, type: "webclip" }
    ];

    let activeCategoryIndex = 0;
    let selectedFeature = null;
    let currentUUID = '';

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // ==========================================
    // 2. KHỞI TẠO GIAO DIỆN
    // ==========================================
    function init() {
        renderCategories();
        renderFeatures();
    }

    function renderCategories() {
        const container = document.getElementById('categoryScroll');
        container.innerHTML = '';
        categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `cat-btn ${index === activeCategoryIndex ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => setCategory(index);
            container.appendChild(btn);
        });
    }

    function setCategory(index) {
        activeCategoryIndex = index;
        renderCategories();
        renderFeatures();
    }

    function renderFeatures() {
        const list = document.getElementById('featureList');
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        const filtered = features.filter(f => {
            const matchCat = activeCategoryIndex === 0 || f.cat === activeCategoryIndex;
            const matchSearch = f.title.toLowerCase().includes(searchText) || f.desc.toLowerCase().includes(searchText);
            return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:40px; color:#9ca3af;">Không tìm thấy tính năng.</div>`;
            return;
        }

        filtered.forEach(f => {
            const card = document.createElement('div');
            card.className = 'feature-card';
            card.onclick = () => openPanel(f);
            card.innerHTML = `
                <div class="f-icon">${f.icon}</div>
                <div class="f-info">
                    <div class="f-title">${f.title}</div>
                    <div class="f-desc">${f.desc}</div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    // ==========================================
    // 3. XỬ LÝ PANEL CẤU HÌNH
    // ==========================================
    function openPanel(feature) {
        selectedFeature = feature;
        currentUUID = generateUUID();
        
        document.getElementById('panelTitle').innerText = `${feature.icon} ${feature.title}`;
        buildForm(feature.type);
        updatePreview();
        
        document.getElementById('configOverlay').classList.add('show');
        document.getElementById('configPanel').classList.add('show');
        document.querySelector('.panel-body').scrollTop = 0;
    }

    function closePanel() {
        document.getElementById('configOverlay').classList.remove('show');
        document.getElementById('configPanel').classList.remove('show');
        selectedFeature = null;
    }

    function buildForm(type) {
        const form = document.getElementById('formContainer');
        let html = '';

        const inputRow = (label, id, placeholder, typeAttr="text", val="") => `
            <div class="form-group">
                <label>${label}</label>
                <input type="${typeAttr}" id="${id}" placeholder="${placeholder}" value="${val}" oninput="updatePreview()">
            </div>`;

        switch(type) {
            case 'vpn_ikev2':
                html += inputRow("Tên cấu hình", "f_name", "VD: VIPRE Game VPN", "text", "Game VPN");
                html += inputRow("Server (Remote ID)", "f_server", "VD: vpn.game.com");
                html += inputRow("Username", "f_user", "Nhập user");
                html += inputRow("Password", "f_pass", "Nhập pass", "password");
                break;
            case 'vpn_l2tp':
                html += inputRow("Tên cấu hình", "f_name", "VD: VPN L2TP", "text", "L2TP VPN");
                html += inputRow("Server", "f_server", "VD: vpn.game.com");
                html += inputRow("Username", "f_user", "Nhập user");
                html += inputRow("Password", "f_pass", "Nhập pass", "password");
                html += inputRow("Shared Secret", "f_secret", "Nhập shared secret");
                break;
            case 'proxy':
                html += `<div class="form-group"><label>Loại Proxy</label>
                    <select id="f_type" onchange="updatePreview()">
                        <option value="HTTP">HTTP</option>
                        <option value="SOCKS">SOCKS</option>
                    </select></div>`;
                html += inputRow("Server (IP)", "f_server", "VD: 103.1.2.3");
                html += inputRow("Port", "f_port", "VD: 8080", "number");
                html += inputRow("Username (Tùy chọn)", "f_user", "Bỏ trống nếu không dùng");
                html += inputRow("Password (Tùy chọn)", "f_pass", "Bỏ trống nếu không dùng", "password");
                break;
            case 'pac':
                html += inputRow("URL File PAC", "f_pac", "VD: http://domain.com/file.pac");
                break;
            case 'dns':
                html += inputRow("DNS Server 1", "f_dns1", "VD: 1.1.1.1", "text", "1.1.1.1");
                html += inputRow("DNS Server 2", "f_dns2", "VD: 8.8.8.8", "text", "8.8.8.8");
                break;
            case 'wifi_static':
                html += inputRow("Tên Wi-Fi (SSID)", "f_ssid", "Nhập tên Wi-Fi");
                html += inputRow("Mật khẩu Wi-Fi", "f_wifipass", "Nhập mật khẩu", "password");
                html += inputRow("IP Tĩnh", "f_ip", "VD: 192.168.1.100");
                html += inputRow("Subnet Mask", "f_mask", "VD: 255.255.255.0", "text", "255.255.255.0");
                html += inputRow("Router (Gateway)", "f_router", "VD: 192.168.1.1");
                break;
            case 'wifi_auto':
                html += inputRow("Tên Wi-Fi (SSID)", "f_ssid", "Nhập tên Wi-Fi");
                html += inputRow("Mật khẩu Wi-Fi", "f_wifipass", "Nhập mật khẩu", "password");
                break;
            case 'wifi_enterprise':
                html += inputRow("Tên Wi-Fi (SSID)", "f_ssid", "Nhập tên Wi-Fi");
                html += inputRow("Username", "f_user", "Nhập user doanh nghiệp");
                html += inputRow("Password", "f_pass", "Nhập pass", "password");
                break;
            case 'webclip':
                html += inputRow("Tên Icon", "f_name", "VD: Liên Quân");
                html += inputRow("URL Trang Web", "f_url", "VD: https://lienquan.garena.vn");
                break;
            case 'apn':
                html += inputRow("Tên APN", "f_apn", "VD: m-wap");
                html += inputRow("Username APN", "f_user", "Nhập user (nếu có)");
                html += inputRow("Password APN", "f_pass", "Nhập pass (nếu có)", "password");
                break;
            case 'ota_block':
                html += `<div style="padding: 10px; background: rgba(245, 158, 11, 0.1); border-left: 4px solid #f59e0b; border-radius: 5px; margin-bottom: 15px; font-size:13px;">
                    Cấu hình chặn cập nhật iOS (OTA Block). Không cần nhập liệu.
                </div>`;
                html += inputRow("Tên cấu hình", "f_name", "Nhập tên cấu hình", "text", "Block OTA");
                break;
            case 'cert':
                html += `<div style="padding: 10px; background: rgba(245, 158, 11, 0.1); border-left: 4px solid #f59e0b; border-radius: 5px; margin-bottom: 15px; font-size:13px;">
                    Để cài chứng chỉ, bạn cần có nội dung mã Base64 của chứng chỉ. (Tính năng này tạo khung mẫu).
                </div>`;
                html += inputRow("Tên cấu hình", "f_name", "Nhập tên chứng chỉ", "text", "Root CA");
                html += `<div class="form-group"><label>Mã Base64 Chứng Chỉ (CER)</label>
                    <textarea id="f_cert" rows="3" style="width:100%; background:rgba(0,0,0,0.5); color:white; border:1px solid var(--border); border-radius:8px; padding:10px;" placeholder="Dán mã Base64 vào đây..." oninput="updatePreview()"></textarea></div>`;
                break;
            case 'email':
                html += inputRow("Tên tài khoản", "f_name", "VD: Team eSports", "text", "Email Team");
                html += inputRow("Địa chỉ Email", "f_email", "VD: team@game.com");
                html += inputRow("Mật khẩu", "f_pass", "Nhập mật khẩu", "password");
                break;
            case 'ldap':
                html += inputRow("Tên cấu hình", "f_name", "VD: Danh bạ nội bộ", "text", "LDAP Contacts");
                html += inputRow("Server LDAP", "f_server", "VD: ldap.game.com");
                break;
            default:
                html += inputRow("Tên cấu hình", "f_name", "Nhập tên cấu hình", "text", selectedFeature.title);
                break;
        }
        form.innerHTML = html;
    }

    // ==========================================
    // 4. TẠO XML CHUẨN CHO TỪNG TÍNH NĂNG THẬT
    // ==========================================
    function buildXMLContent() {
        if(!selectedFeature) return "<!-- Chưa chọn tính năng -->";
        
        const type = selectedFeature.type;
        const uuid = currentUUID;
        let payloadContent = "";
        const val = (id) => document.getElementById(id) ? document.getElementById(id).value : "";

        switch(type) {
            case 'vpn_ikev2':
                payloadContent = `
                <dict>
                    <key>IKEv2</key>
                    <dict>
                        <key>AuthenticationMethod</key><string>None</string>
                        <key>Username</key><string>${val('f_user')}</string>
                        <key>Password</key><string>${val('f_pass')}</string>
                        <key>ExtendedAuthEnabled</key><integer>1</integer>
                        <key>RemoteAddress</key><string>${val('f_server')}</string>
                        <key>RemoteIdentifier</key><string>${val('f_server')}</string>
                        <key>LocalIdentifier</key><string>${val('f_user')}</string>
                    </dict>
                    <key>PayloadDisplayName</key><string>${val('f_name')}</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.vpn.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.vpn.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                    <key>UserDefinedName</key><string>${val('f_name')}</string>
                    <key>VPNType</key><string>IKEv2</string>
                </dict>`;
                break;

            case 'vpn_l2tp':
                payloadContent = `
                <dict>
                    <key>VPNType</key><string>L2TP</string>
                    <key>UserDefinedName</key><string>${val('f_name')}</string>
                    <key>IPv4</key><dict><key>OverridePrimary</key><integer>1</integer></dict>
                    <key>PPP</key>
                    <dict>
                        <key>AuthName</key><string>${val('f_user')}</string>
                        <key>AuthPassword</key><string>${val('f_pass')}</string>
                        <key>CommRemoteAddress</key><string>${val('f_server')}</string>
                    </dict>
                    <key>IPSec</key>
                    <dict>
                        <key>AuthenticationMethod</key><string>SharedSecret</string>
                        <key>SharedSecret</key><string>${val('f_secret')}</string>
                    </dict>
                    <key>PayloadDisplayName</key><string>${val('f_name')}</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.vpnl2tp.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.vpn.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'proxy':
                let auth = val('f_user') ? `<key>ProxyUsername</key><string>${val('f_user')}</string><key>ProxyPassword</key><string>${val('f_pass')}</string>` : '';
                payloadContent = `
                <dict>
                    <key>ProxyType</key><string>${val('f_type')}</string>
                    <key>ProxyServer</key><string>${val('f_server')}</string>
                    <key>ProxyServerPort</key><integer>${val('f_port')}</integer>
                    ${auth}
                    <key>PayloadDisplayName</key><string>Proxy Settings</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.proxy.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.proxy.http</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'pac':
                payloadContent = `
                <dict>
                    <key>ProxyType</key><string>Auto</string>
                    <key>ProxyPACURL</key><string>${val('f_pac')}</string>
                    <key>PayloadDisplayName</key><string>Auto Proxy</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.pac.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.proxy.http</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'dns':
                payloadContent = `
                <dict>
                    <key>DNSSettings</key>
                    <dict>
                        <key>DNSProtocol</key><string>HTTPS</string>
                        <key>ServerURL</key><string>https://dns.google/dns-query</string>
                        <key>ServerAddresses</key>
                        <array>
                            <string>${val('f_dns1')}</string>
                            <string>${val('f_dns2')}</string>
                        </array>
                    </dict>
                    <key>PayloadDisplayName</key><string>DNS Config</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.dns.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.dnsSettings.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'wifi_static':
                payloadContent = `
                <dict>
                    <key>AutoJoin</key><true/>
                    <key>SSID_STR</key><string>${val('f_ssid')}</string>
                    <key>EncryptionType</key><string>WPA</string>
                    <key>Password</key><string>${val('f_wifipass')}</string>
                    <key>IPv4</key>
                    <dict>
                        <key>ConfigMethod</key><string>Manual</string>
                        <key>Addresses</key><array><string>${val('f_ip')}</string></array>
                        <key>SubnetMasks</key><array><string>${val('f_mask')}</string></array>
                        <key>Routers</key><array><string>${val('f_router')}</string></array>
                    </dict>
                    <key>PayloadDisplayName</key><string>Wi-Fi Static</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.wifi.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.wifi.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'wifi_auto':
                payloadContent = `
                <dict>
                    <key>AutoJoin</key><true/>
                    <key>SSID_STR</key><string>${val('f_ssid')}</string>
                    <key>EncryptionType</key><string>WPA</string>
                    <key>Password</key><string>${val('f_wifipass')}</string>
                    <key>PayloadDisplayName</key><string>Wi-Fi Auto</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.wifiauto.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.wifi.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'wifi_enterprise':
                payloadContent = `
                <dict>
                    <key>AutoJoin</key><true/>
                    <key>SSID_STR</key><string>${val('f_ssid')}</string>
                    <key>EncryptionType</key><string>WPA2</string>
                    <key>EAPClientConfiguration</key>
                    <dict>
                        <key>UserName</key><string>${val('f_user')}</string>
                        <key>UserPassword</key><string>${val('f_pass')}</string>
                        <key>AcceptEAPTypes</key><array><integer>21</integer></array>
                    </dict>
                    <key>PayloadDisplayName</key><string>Wi-Fi Enterprise</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.wifienterprise.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.wifi.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'webclip':
                payloadContent = `
                <dict>
                    <key>FullScreen</key><true/>
                    <key>Icon</key><data>iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==</data>
                    <key>Label</key><string>${val('f_name')}</string>
                    <key>URL</key><string>${val('f_url')}</string>
                    <key>PayloadDisplayName</key><string>WebClip</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.webclip.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.webClip.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'apn':
                payloadContent = `
                <dict>
                    <key>DefaultsDomainName</key><string>com.apple.managedCarrier</string>
                    <key>PayloadDisplayName</key><string>APN Settings</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.apn.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.managedCarrier</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                    <key>APN</key><string>${val('f_apn')}</string>
                    <key>Username</key><string>${val('f_user')}</string>
                    <key>Password</key><string>${val('f_pass')}</string>
                </dict>`;
                break;

            case 'ota_block':
                payloadContent = `
                <dict>
                    <key>Action</key><string>Deny</string>
                    <key>FilterType</key><string>Plugin</string>
                    <key>PluginBundleID</key><string>com.apple.webcontent-filter</string>
                    <key>PayloadDisplayName</key><string>Block OTA</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.blockota.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.webcontent-filter</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                    <key>WebContentFilter</key>
                    <dict>
                        <key>BlacklistURLs</key>
                        <array>
                            <string>mesu.apple.com</string>
                            <string>appldnld.apple.com</string>
                            <string>updates.cdn-apple.com</string>
                        </array>
                    </dict>
                </dict>`;
                break;

            case 'cert':
                payloadContent = `
                <dict>
                    <key>PayloadCertificateFileName</key><string>root.cer</string>
                    <key>PayloadContent</key><data>${val('f_cert') || 'MIIB... (Mã Base64)'}</data>
                    <key>PayloadDisplayName</key><string>${val('f_name')}</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.cert.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.security.root</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'email':
                payloadContent = `
                <dict>
                    <key>EmailAccountDescription</key><string>${val('f_name')}</string>
                    <key>EmailAccountType</key><string>EmailTypeIMAP</string>
                    <key>EmailAddress</key><string>${val('f_email')}</string>
                    <key>IncomingMailServerAuthentication</key><string>EmailAuthPassword</string>
                    <key>IncomingMailServerHostName</key><string>imap.${val('f_email').split('@')[1] || 'domain.com'}</string>
                    <key>IncomingMailServerUsername</key><string>${val('f_email')}</string>
                    <key>IncomingMailServerPassword</key><string>${val('f_pass')}</string>
                    <key>OutgoingMailServerHostName</key><string>smtp.${val('f_email').split('@')[1] || 'domain.com'}</string>
                    <key>OutgoingMailServerUsername</key><string>${val('f_email')}</string>
                    <key>OutgoingMailServerPassword</key><string>${val('f_pass')}</string>
                    <key>PayloadDisplayName</key><string>${val('f_name')}</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.email.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.mail.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            case 'ldap':
                payloadContent = `
                <dict>
                    <key>LDAPAccountDescription</key><string>${val('f_name')}</string>
                    <key>LDAPAccountHostName</key><string>${val('f_server')}</string>
                    <key>LDAPAccountUseSSL</key><true/>
                    <key>PayloadDisplayName</key><string>${val('f_name')}</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.ldap.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.ldap.account</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;

            default:
                payloadContent = `
                <dict>
                    <key>Note</key><string>Tính năng ${selectedFeature.title} đang được cập nhật cấu trúc.</string>
                    <key>PayloadDisplayName</key><string>${val('f_name') || selectedFeature.title}</string>
                    <key>PayloadIdentifier</key><string>com.mobileconfig.dummy.${uuid}</string>
                    <key>PayloadType</key><string>com.apple.generic.managed</string>
                    <key>PayloadUUID</key><string>${uuid}</string>
                    <key>PayloadVersion</key><integer>1</integer>
                </dict>`;
                break;
        }

        return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <array>
        ${payloadContent}
    </array>
    <key>PayloadDisplayName</key>
    <string>${selectedFeature.title}</string>
    <key>PayloadIdentifier</key>
    <string>com.mobileconfig.profile.${generateUUID()}</string>
    <key>PayloadOrganization</key>
    <string>MobileConfig Pro</string>
    <key>PayloadRemovalDisallowed</key>
    <false/>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>${generateUUID()}</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
</dict>
</plist>`;
    }

    function updatePreview() {
        if (!selectedFeature) return;
        const xml = buildXMLContent();
        document.getElementById('xmlPreview').innerText = xml;
    }

    function generateConfigFile() {
        if(!selectedFeature) return;
        const xml = buildXMLContent();
        const blob = new Blob([xml], { type: 'application/x-apple-aspen-config' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Config_${selectedFeature.title.replace(/\s+/g, '_')}.mobileconfig`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    window.onload = init;
</script>
</body>
</html>
